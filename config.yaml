# CADRE Configuration
# Paper: "CADRE: A Context- and Domain-Aware Routing Engine for Dialogue State Tracking"
# All values in this file are the ones listed in Appendix A (Table 4) of the paper.

# ─── Paths ────────────────────────────────────────────────────────────────────
# NOTE: When running on Colab, these paths are overwritten at runtime by the
# notebook cell that points them to Google Drive for persistence.
paths:
  data_dir: "./data/multiwoz"          # Raw MultiWOZ 2.4 JSON files
  processed_dir: "./data/processed"    # Preprocessed tensors / jsonl
  model_dir: "./models/prompt_dst"     # Saved FLAN-T5 checkpoints
  expert_pool_dir: "./data/expert_pools"
  results_dir: "./results"

# ─── Data ─────────────────────────────────────────────────────────────────────
data:
  dataset: "multiwoz"                  # "multiwoz" | "sgd"
  multiwoz_version: "2.4"
  few_shot_ratio: 0.05                 # 5% of official training data (paper setting)
  holdout_dialogues: 100               # Dialogues from val set for expert pool construction
  domains:
    - hotel
    - restaurant
    - attraction
    - train
    - taxi
    - hospital
    - police

# ─── Prompt-DST (SLM) ─────────────────────────────────────────────────────────
prompt_dst:
  backbone: "google/flan-t5-large"     # Paper Section 2.1
  max_input_length: 1024
  max_output_length: 256
  batch_size: 2                        # Reduced for T4 GPU (15GB); increase if more VRAM
  eval_batch_size: 4                   # Reduced for T4 GPU
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  num_epochs: 10
  gradient_accumulation_steps: 16      # Effective batch = 2 × 16 = 32
  bf16: true                           # Safe on ≤16GB GPU
  save_best_metric: "tlb_jga"
  early_stopping_patience: 3

# ─── IC-DST (LLM) ─────────────────────────────────────────────────────────────
ic_dst:
  provider: "google"                   # "google" (Gemini)
  model: "gemini-2.5-flash"            # Fast + cheap for inference
  num_exemplars: 10                    # K in-context examples (paper: 10)
  max_tokens: 512
  temperature: 0.0                     # Greedy equivalent for structured output
  # Exemplar selection (paper Section 2.2 / 4.2):
  #   "random"   — deployed CADRE default
  #   "semantic" — SenBERT-retrieved top-K exemplars (Section 4.2, negative result)
  exemplar_selection: "random"
  exemplar_encoder: "sentence-transformers/all-mpnet-base-v2"

# ─── Router (CADRE) ────────────────────────────────────────────────────────
router:
  # Base routing decision (paper Section 2.3 / 4.1):
  #   "knn" — non-parametric KNN majority vote over expert pools (deployed CADRE)
  #   "mrl" — margin-ranked learned classifier head (Section 4.1, negative result)
  router_type: "knn"
  retriever_backbone: "sentence-transformers/all-mpnet-base-v2"  # SenBERT, off-the-shelf
  top_k: 10                            # Majority vote over K neighbours
  tie_break: "slm"                     # Prefer SLM on tie (paper setting)

  # Expert pool sizes
  slm_pool_size: 100                   # Turns per expert pool (MWOZ)
  llm_pool_size: 100

  # Contrastive fine-tuning of the retriever — NOT part of the CADRE paper.
  # Inherited from OrchestraLLM; the paper uses the off-the-shelf encoder.
  # Set use_fine_tuned_retriever: true to load ./data/expert_pools/retriever
  # if you trained one with `python router.py train_retriever`.
  use_fine_tuned_retriever: false
  supervision: "task+expert"           # "task" | "expert" | "task+expert" | "none"
  contrastive_pairs: 25                # l positive + l negative pairs
  contrastive_lr: 2.0e-5
  contrastive_epochs: 5
  contrastive_batch_size: 16
  contrastive_temperature: 0.07

  # Domain-aware routing (paper Section 2.4 / 2.5)
  domain_aware: true                   # Enable domain-switch override
  reliability_threshold: 0.40          # τ — min SLM reliability to trust; calibrated on holdout
  calibration:
    thresholds: [0.30, 0.40, 0.50, 0.60, 0.70, 0.80]
    override_rate_band: [0.05, 0.15]   # pick the smallest τ whose override rate is in this band
  domain_keywords:
    hotel: ["hotel", "room", "stay", "accommodation", "lodge", "inn", "guesthouse"]
    restaurant: ["restaurant", "food", "eat", "dining", "cuisine", "meal", "lunch", "dinner"]
    attraction: ["attraction", "museum", "park", "theatre", "cinema", "gallery", "visit", "sightseeing"]
    train: ["train", "railway", "rail", "depart", "arrive"]
    taxi: ["taxi", "cab", "ride", "pick up", "pickup", "drop off"]
    hospital: ["hospital", "department"]

# ─── Margin-ranked learned router (paper Section 4.1, negative result) ────────
mrl_router:
  hidden_dim: 128
  learning_rate: 2.0e-5
  batch_size: 16
  warmup_epochs: 2                     # head-only, encoder frozen
  e2e_epochs: 3                        # encoder + head
  decision_threshold: 0.5              # route to LLM iff P(LLM) >= 0.5

# ─── Evaluation (paper Section 3.1) ───────────────────────────────────────────
evaluation:
  metrics:
    - "tlb_jga"                        # Turn-Level Belief JGA
    - "joint_goal_accuracy"            # DST JGA (accumulated states)
    - "slot_f1"                        # average slot-value F1
    - "per_domain_tlb_jga"
    - "routing_share"                  # % turns routed to SLM / LLM
    - "domain_override_rate"
    - "wall_clock"
  # Evaluation slices used in the paper (val set, dialogue order, whole dialogues):
  #   headline  — 204-turn slice (Tables 1-3, Figures 2-3)
  #   wide      — 736-turn slice (per-domain trends, Section 3.3)
  slices:
    headline: 204
    wide: 736
